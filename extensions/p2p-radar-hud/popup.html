<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>P2P Radar HUD Status</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #0b0e14;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-variant-numeric: tabular-nums;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2533;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-card {
      background: #12161f;
      border: 1px solid #1e2533;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }
    .stat-val {
      color: #ffffff;
      font-weight: 700;
    }
    .stat-emerald {
      color: #10b981;
    }
    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-action:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="brand-title">
      <span class="dot-live"></span>
      <span>P2P Radar HUD</span>
    </div>
    <span class="font-mono" style="font-size: 10px; color: #64748b;">v1.0.0</span>
  </div>

  <div class="status-card font-mono">
    <div class="stat-row">
      <span>Estado:</span>
      <span class="stat-val stat-emerald" id="status-text">Conectado</span>
    </div>
    <div class="stat-row">
      <span>Última Sincronización:</span>
      <span class="stat-val" id="sync-text">--:--:--</span>
    </div>
    <div class="stat-row">
      <span>Perfil / Modo:</span>
      <span class="stat-val" id="tier-text">--</span>
    </div>
    <div class="stat-row">
      <span>Mejor Spread:</span>
      <span class="stat-val stat-emerald" id="spread-text">--</span>
    </div>
  </div>

  <button type="button" class="btn-action font-mono" id="btn-open-app">
    ⚡ Abrir Cockpit P2P (/radar)
  </button>

  <script src="popup.js"></script>
</body>
</html>
