services:
  telegram-sentinel:
    build:
      context: ../../
      dockerfile: deploy/vps/Dockerfile
    image: p2p-telegram-sentinel:latest
    container_name: p2p-telegram-sentinel
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
