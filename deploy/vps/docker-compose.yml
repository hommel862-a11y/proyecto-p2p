services:
  telegram-sentinel:
    build:
      context: ../../
      dockerfile: deploy/vps/Dockerfile
      target: telegram-sentinel
    image: p2p-telegram-sentinel:latest
    container_name: p2p-telegram-sentinel
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INBOUND_GATEWAY_URL=http://inbound-gateway:3030
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg17-alpine
    container_name: p2p-arm-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-arm_multi_workspace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_arm_data:/var/lib/postgresql/data
      - ../../electron/main/db/migrations/001_init_arm_schema.sql:/docker-entrypoint-initdb.d/001_init_arm_schema.sql:ro
      - ../../electron/main/db/migrations/002_crm_unification_and_hardening.sql:/docker-entrypoint-initdb.d/002_crm_unification_and_hardening.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arm_multi_workspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  inbound-gateway:
    build:
      context: ../../
      dockerfile: deploy/vps/Dockerfile
      target: inbound-gateway
    image: p2p-inbound-gateway:latest
    container_name: p2p-inbound-gateway
    command: ["node", "packages/inbound-gateway/dist/index.js"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3030:3030"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - INBOUND_GATEWAY_PORT=3030
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/arm_multi_workspace}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_arm_data:
