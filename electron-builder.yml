appId: com.p2p.decisiontool
productName: P2P Decision Tool
directories:
  output: release
  buildResources: build
# Electron entry point (overrides package.json so the web build is unaffected).
extraMetadata:
  main: electron/dist/main/index.js
files:
  - electron/dist/**/*
  - dist/p2p/browser/**/*
  - packages/mcp-server/dist/**/*
  - packages/mcp-server/package.json
  - package.json
asarUnpack:
  - packages/mcp-server/**/*
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
