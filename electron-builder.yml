appId: com.p2p.decisiontool
productName: P2P Decision Tool
directories:
  output: release
  buildResources: build
# Electron entry point (overrides package.json so the web build is unaffected).
extraMetadata:
  main: electron/dist/main/index.js
files:
  - electron/dist/**/*
  - dist/p2p/browser/**/*
  - packages/mcp-server/dist/**/*
  - packages/mcp-server/package.json
  - package.json
  # The Telegram BACKTEST_RUN action spawns this harness as a Node child, so it has
  # to travel with the app.
  - scripts/backtest.cjs
asarUnpack:
  - packages/mcp-server/**/*
  # A script cannot be spawned from inside app.asar; the runner resolves the
  # app.asar.unpacked copy.
  - scripts/backtest.cjs
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
