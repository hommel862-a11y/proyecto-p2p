<div class="micro-shell" [attr.data-freshness]="freshnessStatus()">
  <!-- Command Bar (Functional Liquid Glass) -->
  <header class="command-bar functional-glass" aria-label="Barra de comandos de microestructura L2">
    <div class="cmd-row-primary">
      <!-- Freshness Ring & Refresh -->
      <div class="freshness-cluster">
        <span
          class="freshness-ring"
          [attr.data-status]="freshnessStatus()"
          role="status"
          [attr.aria-label]="'Estado de frescura de Binance P2P: ' + freshnessStatus()"
        >
          <span class="freshness-dot" aria-hidden="true"></span>
          <strong class="freshness-label">{{ freshnessStatus() }}</strong>
          <span class="freshness-age num-tabular">{{ freshnessAgeLabel() }}</span>
        </span>

        <button
          type="button"
          class="cmd-btn refresh-btn"
          [disabled]="isLoading()"
          (click)="forceScan()"
        >
          {{ isLoading() ? 'Sincronizando...' : '⚡ Escanear' }}
        </button>
      </div>

      <!-- Side Toggle + Quick Ticket Selector -->
      <div class="ticket-side-cluster">
        <div class="segmented-side" role="group" aria-label="Lado del libro activo">
          <button
            type="button"
            class="seg-btn"
            [class.active]="engine.selectedSide() === 'SELL'"
            [attr.aria-pressed]="engine.selectedSide() === 'SELL'"
            (click)="engine.selectedSide.set('SELL')"
          >
            Venta (Ask)
          </button>
          <button
            type="button"
            class="seg-btn"
            [class.active]="engine.selectedSide() === 'BUY'"
            [attr.aria-pressed]="engine.selectedSide() === 'BUY'"
            (click)="engine.selectedSide.set('BUY')"
          >
            Compra (Bid)
          </button>
        </div>

        <div class="ticket-presets" role="group" aria-label="Ticket objetivo rápido">
          @for (preset of ticketPresets; track preset) {
            <button
              type="button"
              class="preset-btn num-tabular"
              [attr.data-testid]="'ticket-preset-' + preset"
              [class.active]="engine.targetUsdt() === preset"
              [attr.aria-pressed]="engine.targetUsdt() === preset"
              (click)="setTargetUsdt(preset)"
            >
              {{ preset >= 1000 ? '$' + (preset / 1000) + 'K' : '$' + preset }}
            </button>
          }

          <label class="ticket-input-wrap" for="micro-ticket-input">
            <span class="sr-only">Ticket USDT personalizado</span>
            <span aria-hidden="true">$</span>
            <input
              #ticketInput
              id="micro-ticket-input"
              type="number"
              min="20"
              step="50"
              class="ticket-input num-tabular"
              [value]="engine.targetUsdt()"
              (change)="onTicketInputChange(ticketInput.value)"
            />
          </label>
        </div>
      </div>

      <!-- Operational Toggles -->
      <div class="toggles-cluster">
        <button
          type="button"
          class="toggle-chip"
          [class.active]="engine.cleanModeEnabled()"
          [attr.aria-pressed]="engine.cleanModeEnabled()"
          (click)="toggleCleanMode()"
        >
          <span>Libro Limpio</span>
          <kbd>L</kbd>
        </button>

        <button
          type="button"
          class="toggle-chip"
          [class.active]="engine.verifiedProOnly()"
          [attr.aria-pressed]="engine.verifiedProOnly()"
          (click)="toggleVerifiedPro()"
        >
          <span>Verificados PRO</span>
        </button>

        <button
          type="button"
          class="toggle-chip"
          [class.active]="!isAudioMuted()"
          [attr.aria-pressed]="!isAudioMuted()"
          [attr.aria-label]="isAudioMuted() ? 'Activar alertas de audio selectivas' : 'Silenciar alertas de audio'"
          (click)="toggleAudioAlerts()"
        >
          <span>{{ isAudioMuted() ? 'Audio OFF' : 'Audio ON' }}</span>
        </button>

        <button
          type="button"
          class="toggle-chip split-drawer-btn"
          data-testid="btn-toggle-drawer"
          [class.active]="splitDrawerOpen()"
          [attr.aria-pressed]="splitDrawerOpen()"
          (click)="onToggleSplitDrawer()"
        >
          <span>Split-Drawer</span>
        </button>
      </div>
    </div>

    <!-- Bank Pills with Inline SUDEBAN Quota % -->
    <div class="bank-pills-row" role="group" aria-label="Bancos con cupo SUDEBAN">
      @for (bank of bankQuotaPills(); track bank.code) {
        <button
          type="button"
          class="bank-quota-pill"
          [class.active]="bank.isActive"
          [class.is-warning]="bank.isWarning"
          [class.is-critical]="bank.isCritical"
          [attr.aria-pressed]="bank.isActive"
          (click)="selectBank(bank.code)"
        >
          <span>{{ bank.label }}</span>
          <span class="quota-pct num-tabular">{{ bank.quotaPct }}%</span>
        </button>
      }
    </div>

    <!-- >85% SUDEBAN Saturation Warning + 1-Click Rotation -->
    @if (saturationWarning(); as warn) {
      <div class="sudeban-warning-bar" data-testid="sudeban-rotation-warning" role="alert">
        <span>
          ⚠️ Saturación SUDEBAN en <strong>{{ warn.bankLabel }} ({{ warn.quotaPct }}%)</strong> — supera el umbral del 85%.
        </span>
        <button
          type="button"
          class="rotate-bank-btn"
          data-testid="sudeban-rotate-btn"
          (click)="rotateToHealthiestBank()"
        >
          Rotar a {{ warn.recommendedBankLabel }} ({{ warn.recommendedQuotaPct }}%)
        </button>
      </div>
    }
  </header>

  <!-- Row 1: 4 Bento KPI Strip -->
  <app-microstructure-kpi-strip
    [sqsResult]="engine.sqsResult()"
    [spoofReport]="engine.spoofReport()"
    [vpinReport]="engine.vpinReport()"
    [tradeImpact]="engine.tradeImpact()"
    [volatility2h]="engine.volatility2h()"
    [targetUsdt]="engine.targetUsdt()"
    [side]="engine.selectedSide()"
    [bcvRateVes]="engine.resolvedBcvRateVes()"
  />

  <!-- Row 2: Vista A v2 Main Bento (Left DOM Ladder | Center Chart+Brackets + Right Strategist) -->
  <div class="vista-a-main-grid">
    <app-microstructure-orderbook-ladder
      [buyOffers]="ladderBuyOffers()"
      [sellOffers]="ladderSellOffers()"
      [cleanModeEnabled]="engine.cleanModeEnabled()"
      [liveBreakEvenSellPrice]="engine.liveBreakEvenSellPrice()"
      [markovFill]="engine.markovFill()"
      [trap]="engine.makerVsTakerComparison().apparentVsCleanSpreadTrap"
      [selectedSide]="engine.selectedSide()"
      [executionLocked]="isExecutionLocked()"
      [whatIfPreview]="activeWhatIf()"
      (hoverPreview)="onHoverRow($event)"
      (fixPrice)="onFixLadderPrice($event)"
      (takeOffer)="onTakeOffer($event)"
    />

    <app-microstructure-quant-advisor
      [buyOffers]="engine.fullBuyOffers()"
      [sellOffers]="engine.fullSellOffers()"
      [sanitizedOffers]="engine.sanitizedDepth().sanitizedOffers"
      [selectedSide]="engine.selectedSide()"
      [targetUsdt]="engine.targetUsdt()"
      [refRate]="engine.refRate()"
      [liveBreakEvenSellPrice]="engine.liveBreakEvenSellPrice()"
      [avellanedaQuotes]="engine.avellanedaQuotes()"
      [obiReport]="engine.obiReport()"
      [allBracketsSummary]="engine.allBracketsSummary()"
      [selectedBracket]="engine.selectedBracket()"
      [makerVsTakerComparison]="engine.makerVsTakerComparison()"
      [sqsResult]="engine.sqsResult()"
      [slicingPlan]="engine.slicingPlan()"
      [historyPoints]="historyPoints()"
      [freshnessStatus]="freshnessStatus()"
      [executionLocked]="isExecutionLocked()"
      (operateBracket)="onOperateBracket($event)"
      (applyToDesk)="onApplyToDesk()"
      (sendToRepricer)="onSendToRepricer()"
      (openAdStudio)="onOpenAdStudio()"
      (sendTelegramAlert)="onSendTelegramAlert()"
    />
  </div>

  <!-- Row 3: Collapsible Forensic Audit & OTC Whales -->
  <app-microstructure-audit-table
    [enrichedBuyOffers]="engine.enrichedBuyOffers()"
    [enrichedSellOffers]="engine.enrichedSellOffers()"
    [selectedSide]="engine.selectedSide()"
    [otcWhaleReport]="engine.otcWhaleReport()"
    [refRate]="engine.refRate()"
    [spoofReport]="engine.spoofReport()"
    (takeOffer)="onTakeOffer($event)"
  />
</div>
