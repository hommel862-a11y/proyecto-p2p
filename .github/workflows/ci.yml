name: CI

on:
  push:
    branches: [main, feat/p2p-decision-tool-mvp]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (app)
        run: npx ng test p2p --no-watch
      - name: Unit tests (core)
        run: npx ng test core --no-watch
      - name: Unit tests (electron / secure IPC)
        run: npm run test:electron
      - name: Build web bundle (needed by the Playwright static server)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (web)
        run: npx playwright test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK
        run: |
          SDK_ROOT=$HOME/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools
          curl -L https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $SDK_ROOT/cmdline-tools
          mv $SDK_ROOT/cmdline-tools/cmdline-tools $SDK_ROOT/cmdline-tools/latest
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root=$SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build web bundle (needed by Capacitor)
        run: npm run build
      - name: Add Android platform (not committed — regenerated)
        run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: npx cap build android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
